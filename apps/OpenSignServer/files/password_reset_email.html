<html>

<body style="font-family: system-ui, -apple-system, Arial, sans-serif; background:#f5f5f5; margin:0; padding:24px;">

        <div style="background:#7A1A1A; padding:18px 24px;">

            <p style="margin:0 0 18px; font-weight:600;">{{username}}</p>

            <p style="margin:0 0 24px;"><a href="{{{link}}}" style="background-color:#7A1A1A; border-radius:6px; padding:12px 22px; text-decoration:none; font-weight:700; color:#ffffff; display:inline-block;">Reset password</a></p>
            <p style="font-size:12px; color:#888888; margin:0;">If you didn't request this, you can safely ignore this email.</p>
        </div>
        <div style="padding:14px 24px; background:#faf7f7; border-top:1px solid #ececec; font-size:11px; color:#999999;">Legal Data Forensic Sign &middot; sign.legaldataforensic.com</div>
    </div>
