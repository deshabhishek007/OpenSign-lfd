<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password updated — LDF Sign</title>
  <style type='text/css'>
    * { box-sizing: border-box; }
    body { font-family: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#f5f3f3; margin:0; color:#222; }
    .wrap { max-width: 460px; margin: 6vh auto; padding: 0 16px; }
    .card { background:#fff; border:1px solid #ececec; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .bar { background:#7A1A1A; padding:16px 24px; }
    .wordmark { font-size:22px; font-weight:800; letter-spacing:-.3px; color:#fff; }
    .wordmark span { color:#D4AF37; }
    .body { padding: 28px 24px 30px; text-align:center; }
    .check { width:52px; height:52px; border-radius:50%; background:#e8f5e9; color:#2e7d32; font-size:28px; line-height:52px; margin:0 auto 14px; }
    h1 { font-size:20px; font-weight:700; margin:0 0 8px; color:#222; }
    p { font-size:14px; color:#666; margin:0 0 22px; }
    a.btn { display:inline-block; font-size:15px; font-weight:700; color:#fff; background:#7A1A1A; text-decoration:none; border-radius:7px; padding:11px 22px; }
    a.btn:hover { background:#651414; }
    .foot { text-align:center; font-size:11px; color:#9a9a9a; margin-top:16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="bar"><span class="wordmark">LDF <span>Sign</span></span></div>
      <div class="body">
        <div class="check">&#10003;</div>
        <h1>Password updated</h1>
        <p>Your password has been changed successfully. You can now sign in with your new password.</p>
        <a class="btn" href="https://sign.legaldataforensic.com/login">Go to sign in</a>
        <div class="foot">Legal Data Forensic Sign &middot; sign.legaldataforensic.com</div>
      </div>
    </div>
  </div>
</body>
</html>
